async function fetchStock(ticker) {
  const res = await fetch(`/api/stock?ticker=${ticker}`);

  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.data;
}

/* ── CSV parser ── */
function parseCSV(text) {
  const lines = text.trim().split("\n").filter(Boolean);
  const first = lines[0].toLowerCase().split(/[,;\t]/);
  const hasHeader = first.some(c => ["date","open","close","high","low"].includes(c.trim()));
  return (hasHeader ? lines.slice(1) : lines).map(line => {
    const cols = line.split(/[,;\t]/).map(s => s.trim().replace(/"/g,""));
    const date=cols[0], open=parseFloat(cols[1]), high=parseFloat(cols[2]);
    const low=parseFloat(cols[3]), close=parseFloat(cols[4]), volume=parseInt(cols[5])||0;
    if (!date || isNaN(close)) return null;
    return { date, open:open||close, high:high||close, low:low||close, close, volume };
  }).filter(Boolean);
}

/* ── Dow Theory ── */
function analyzeDow(data) {
  if (data.length < 20) return null;
  const closes=data.map(d=>d.close), highs=data.map(d=>d.high), lows=data.map(d=>d.low);
  const swingHighs=[], swingLows=[];
  for (let i=5; i<data.length-5; i++) {
    if (highs[i]===Math.max(...highs.slice(i-5,i+6))) swingHighs.push({value:highs[i],date:data[i].date});
    if (lows[i]===Math.min(...lows.slice(i-5,i+6))) swingLows.push({value:lows[i],date:data[i].date});
  }
  let primaryTrend="LATERALE";
  if (swingHighs.length>=2 && swingLows.length>=2) {
    const [h0,h1]=swingHighs.slice(-2),[l0,l1]=swingLows.slice(-2);
    if (h1.value>h0.value && l1.value>l0.value) primaryTrend="RIALZISTA";
    else if (h1.value<h0.value && l1.value<l0.value) primaryTrend="RIBASSISTA";
  }
  const sum=arr=>arr.reduce((a,b)=>a+b,0);
  const ma20=sum(closes.slice(-20))/20;
  const ma50=closes.length>=50?sum(closes.slice(-50))/50:null;
  const current=closes[closes.length-1];
  return {
    primaryTrend,
    secondaryTrend: current>closes[closes.length-10]?"Correzione Rialzista":"Correzione Ribassista",
    ma20:+ma20.toFixed(2), ma50:ma50?+ma50.toFixed(2):null,
    swingHighs:swingHighs.slice(-3), swingLows:swingLows.slice(-3),
    currentPrice:current, priceVsMa20:((current-ma20)/ma20*100).toFixed(2),
  };
}

/* ── Gann Analysis ── */
function analyzeGann(data) {
  if (data.length<10) return null;
  const slice=data.slice(-60);
  const recentHigh=Math.max(...slice.map(d=>d.high)), recentLow=Math.min(...slice.map(d=>d.low));
  const range=recentHigh-recentLow;
  const gannLevels=[0.125,0.25,0.375,0.5,0.625,0.75,0.875].map((r,i)=>({
    label:["1/8","2/8","3/8","4/8 — Equilibrio","5/8","6/8","7/8"][i],
    value:+(recentLow+range*r).toFixed(2),
  }));
  const current=data[data.length-1].close;
  const nearestLevel=gannLevels.reduce((a,b)=>Math.abs(b.value-current)<Math.abs(a.value-current)?b:a);
  const lowIdx=slice.findIndex(d=>d.low===recentLow), daysPassed=slice.length-1-lowIdx;
  const gann1x1=+(recentLow+daysPassed*(range/60)).toFixed(2);
  return { recentHigh:+recentHigh.toFixed(2), recentLow:+recentLow.toFixed(2), range:+range.toFixed(2), gannLevels, nearestLevel, gann1x1, currentPrice:current };
}

/* ── Candlestick ── */
function CandlestickChart({data, gannLevels, ma20}) {
  const ref = React.useRef(null);
  React.useEffect(()=>{
    if (!ref.current||!data?.length) return;
    const canvas=ref.current, dpr=window.devicePixelRatio||1;
    const W=canvas.clientWidth, H=canvas.clientHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
    const P={t:18,r:16,b:36,l:62}, cW=W-P.l-P.r, cH=H-P.t-P.b;
    ctx.fillStyle="#080d1c"; ctx.fillRect(0,0,W,H);
    const vis=data.slice(-60);
    const allP=vis.flatMap(d=>[d.high,d.low]);
    gannLevels?.forEach(l=>allP.push(l.value));
    const minP=Math.min(...allP)*0.995, maxP=Math.max(...allP)*1.005, pR=maxP-minP;
    const toX=i=>P.l+((i+0.5)/vis.length)*cW;
    const toY=p=>P.t+(1-(p-minP)/pR)*cH;
    for(let i=0;i<=5;i++){
      const y=P.t+(i/5)*cH;
      ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(W-P.r,y); ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.font="9px monospace"; ctx.textAlign="right";
      ctx.fillText((maxP-(i/5)*pR).toFixed(2),P.l-4,y+4);
    }
    gannLevels?.forEach((lv,idx)=>{
      const y=toY(lv.value); if(y<P.t||y>P.t+cH) return;
      ctx.strokeStyle=`rgba(255,200,0,${0.15+idx*0.04})`; ctx.setLineDash([3,4]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(W-P.r,y); ctx.stroke(); ctx.setLineDash([]);
    });
    if(ma20){
      ctx.strokeStyle="rgba(100,200,255,0.6)"; ctx.lineWidth=1.5; ctx.beginPath();
      vis.forEach((_,i)=>{ if(i===0) ctx.moveTo(toX(i),toY(ma20)); else ctx.lineTo(toX(i),toY(ma20)); });
      ctx.stroke();
    }
    const cw=Math.max(2,cW/vis.length*0.6);
    vis.forEach((d,i)=>{
      const x=toX(i), col=d.close>=d.open?"#00e676":"#ff1744";
      ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,toY(d.high)); ctx.lineTo(x,toY(d.low)); ctx.stroke();
      ctx.fillStyle=col;
      const bTop=toY(Math.max(d.open,d.close)), bH=Math.max(1,Math.abs(toY(d.open)-toY(d.close)));
      ctx.fillRect(x-cw/2,bTop,cw,bH);
    });
    ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.font="9px monospace"; ctx.textAlign="center";
    [0,Math.floor(vis.length/3),Math.floor(vis.length*2/3),vis.length-1].forEach(i=>{
      if(vis[i]) ctx.fillText(vis[i].date.slice(5),toX(i),H-4);
    });
  },[data,gannLevels,ma20]);
  return <canvas ref={ref} style={{width:"100%",height:"280px"}}/>;
}

DOW: Trend=${dow.primaryTrend}, MA20=${dow.ma20}, MA50=${dow.ma50||"N/D"}, Prezzo=${dow.currentPrice} (${dow.priceVsMa20}% vs MA20)
GANN: Max60gg=${gann.recentHigh}, Min60gg=${gann.recentLow}, Livello vicino=${gann.nearestLevel.label}=${gann.nearestLevel.value}, Angolo1x1=${gann.gann1x1}

Rispondi ESATTAMENTE così:

**🎯 DECISIONE: [COMPRA ORA / ASPETTA / NON COMPRARE]**
Motivazione in una frase.

**📅 QUANDO COMPRARE**
Condizione precisa con prezzi numerici.

**💰 PIANO OPERATIVO**
- Entrata: [prezzo]
- Stop Loss: [prezzo] — -X%
- Target 1: [prezzo] — +X%
- Target 2: [prezzo] — +X%
- Risk/Reward: 1:X

**⚠️ ATTENZIONE**
Un rischio concreto.

⚠ Analisi tecnica, non consulenza finanziaria.`;

  const res = await fetch("/api/ai", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ prompt }),
  });
  const json = await res.json();
  return json.text || "Errore nella risposta AI.";
}

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                  {[["SWING HIGHS",dow.swingHighs,"#00e676"],["SWING LOWS",dow.swingLows,"#ff1744"]].map(([lbl,items,col])=>(
                    <div key={lbl} style={S.card(false)}>
                      <div style={S.lbl}>{lbl}</div>
                      {items.map((it,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:"5px",fontSize:"11px"}}><span style={{color:"rgba(255,255,255,0.35)"}}>{it.date}</span><span style={{color:col,fontWeight:"bold"}}>{it.value.toFixed(2)}</span></div>)}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab==="gann" && (
              <div style={{display:"grid",gap:"10px"}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:"8px"}}>
                  {[{l:"MAX 60GG",v:gann.recentHigh,c:"#00e676"},{l:"MIN 60GG",v:gann.recentLow,c:"#ff1744"},{l:"RANGE",v:gann.range,c:"#fff"},{l:"ANGOLO 1×1",v:gann.gann1x1,c:"#ffd600"}].map(({l,v,c})=>(
                    <div key={l} style={S.card(false)}><div style={S.lbl}>{l}</div><div style={{fontSize:"13px",fontWeight:"bold",color:c}}>{v}</div></div>
                  ))}
                </div>
                <div style={S.card(false)}>
                  <div style={S.lbl}>LIVELLI GANN</div>
                  {gann.gannLevels.map((lv,i)=>{
                    const dist=((lv.value-gann.currentPrice)/gann.currentPrice*100).toFixed(1);
                    const near=lv.label===gann.nearestLevel.label;
                    return <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",marginBottom:"3px",borderRadius:"5px",background:near?"rgba(255,215,0,0.07)":"transparent",border:near?"1px solid rgba(255,215,0,0.18)":"1px solid transparent"}}>
                      <span style={{fontSize:"10px",color:near?"#ffd600":"rgba(255,255,255,0.4)"}}>{near?"◈ ":""}{lv.label}</span>
                      <div style={{display:"flex",gap:"14px"}}>
                        <span style={{fontSize:"12px",fontWeight:"bold",color:near?"#ffd600":"#ccc"}}>{lv.value}</span>
                        <span style={{fontSize:"10px",width:"46px",textAlign:"right",color:dist>0?"#00e676":"#ff1744"}}>{dist>0?"+":""}{dist}%</span>
                      </div>
                    </div>;
                  })}
                </div>
              </div>
            )}

            {tab==="ai" && (
              <div>
                {aiState==="idle" && <div style={{textAlign:"center",padding:"40px 20px"}}>
                  <div style={{fontSize:"36px",marginBottom:"12px",opacity:0.35}}>✦</div>
                  <div style={{color:"rgba(255,255,255,0.4)",fontSize:"12px",marginBottom:"22px"}}>Pronto ad analizzare <strong style={{color:"#ffd600"}}>{ticker}</strong></div>
                  <button onClick={runAI} style={S.btn("gold")}>✦ AVVIA ANALISI AI</button>
                </div>}
                {aiState==="loading" && <div style={{textAlign:"center",padding:"50px 20px",color:"rgba(255,215,0,0.5)"}}>
                  <div className="spin" style={{fontSize:"24px",marginBottom:"10px"}}>◈</div>
                  <div style={{fontSize:"11px",letterSpacing:"2px"}}>ANALISI IN CORSO...</div>
                </div>}
                {aiState==="done" && aiText && <>
                  <div style={{padding:"18px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,215,0,0.12)",borderRadius:"8px",fontSize:"12px",lineHeight:"1.9",color:"rgba(255,255,255,0.8)",whiteSpace:"pre-wrap"}}>
                    {bold(aiText)}
                  </div>
                  <div style={{marginTop:"10px",display:"flex",justifyContent:"flex-end",gap:"8px"}}>
                    <button onClick={runAI} style={{...S.btn("ghost"),fontSize:"10px"}}>⟳ Rigenera</button>
                    <button onClick={()=>setShowReport(true)} style={{...S.btn("gold"),fontSize:"10px"}}>⬇ Report</button>
                  </div>
                  <div style={{marginTop:"10px",padding:"10px 14px",background:"rgba(255,30,30,0.04)",border:"1px solid rgba(255,30,30,0.1)",borderRadius:"6px",fontSize:"9px",color:"rgba(255,255,255,0.28)",lineHeight:"1.6"}}>
                    ⚠ Analisi tecnica a scopo educativo. Non costituisce consulenza finanziaria.
                  </div>
                </>}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
