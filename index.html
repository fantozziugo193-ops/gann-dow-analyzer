async function fetchStock(ticker) {
  const res = await fetch(`/api/stock?ticker=${ticker}`);
  if (!res.ok) throw new Error(`Errore: ${res.status}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.data;
}
